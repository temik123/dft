version: "3.8"

services:
  
  db:
    image: db
    build: 
      context: ./database
    container_name: db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - ${DB_PORT}:5432
    networks:
      - backend_net
    volumes:
      - db_volume:/var/lib/postgres/data
  
  frontend:
    image: frontend
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - ${FRONTEND_PORT}:443
    depends_on:
      - backend
      - db
    networks:
      - frontend_net
    
  backend:
    image: backend
    build: 
      context: ./backend
    container_name: backend
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
    ports:
      - ${BACKEND_PORT}:3001
    depends_on:
         db:
          condition: service_healthy
    networks:
      - backend_net
      - frontend_net
  db_dump:
    image: db_dump
    build: 
      context: ./db_dump
    container_name: db_dump
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_DUMB}
      - DB_USER=${DB_USER_DUMP}
      - DB_PORT=${DB_DUMP_PORT}
    volumes:
      - /var/lib/db_backup_for_docker:/var/lib/backup
    networks:
      - backend_net
    ports:
      - ${DB_DUMP_PORT}:5433
    depends_on:
      - db

networks:
  frontend_net:
  backend_net:
volumes:
  db_volume: